name: IndexNow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow.mjs
